# Kingdom cron jobs — one table per job. Prompts live in prompts/<name>.md, system prompts in system/<name>.md.
# Realm jobs: cwd = the realm repo; the citadel brain is attached through extraArgs (see scripts/kingdom argv).
# Apply with: python3 scripts/jobs.py apply   (asks for confirmation)

# ── Non-kingdom jobs (unchanged) ─────────────────────────────────────────────
[jobs.local-cleanup-v1]
enabled = false
expression = "15 0,4,8,12,16,20 * * *"
cwd = "/Users/fn"
model = "haiku"
permissionMode = "bypassPermissions"
timeoutMs = 120000
allowedTools = []
sessionLimitThreshold = 90

[jobs.powehi-dev-v1]
expression = "45 1,4,7,10,13,16,19,22 * * *"
cwd = "/Users/fn/codespace/powehi"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 1800000
allowedTools = []
sessionLimitThreshold = 90

[jobs.the-kernel-dev-v1]
expression = "50 */2 * * *"
cwd = "/Users/fn/codespace/the_kernel"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 3600000
maxBudget = 10
allowedTools = []
sessionLimitThreshold = 90
# ── Foundation repos (added 2026-09-05; minutes chosen to avoid the existing jobs) ──

# ── Kingdom realm cycles: one realm per hour slot, twice a day, 25-minute timeout ──
[jobs.sigil-cycle]
enabled = true
expression = "5 0,12 * * *"
cwd = "/Users/fn/codespace/sigil"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 1500000
maxBudget = 4
dailyBudgetUsd = 8
allowedTools = []
sessionLimitThreshold = 90
blockTokenLimit = 80000000
extraArgs = ["--add-dir", "/Users/fn/codespace/citadel", "--settings", "/Users/fn/codespace/citadel/realms/sigil/settings.json", "--strict-mcp-config", "--permission-prompts", "none", "--effort", "high"]

