# Kingdom cron jobs — one table per job. Prompts live in prompts/<name>.md, system prompts in system/<name>.md.
# Realm jobs: cwd = the realm repo; the citadel brain is attached through extraArgs (see scripts/kingdom argv).
# Apply with: python3 scripts/jobs.py apply   (asks for confirmation)

# ── Non-kingdom jobs (unchanged) ─────────────────────────────────────────────
[jobs.testforge-dev-v1]
expression = "40 8,20 * * *"
cwd = "/Users/fn/codespace/testforge"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 1800000
allowedTools = []
sessionLimitThreshold = 90
blockTokenLimit = 80000000

[jobs.local-cleanup-v1]
expression = "15 0,4,8,12,16,20 * * *"
cwd = "/Users/fn"
model = "haiku"
permissionMode = "bypassPermissions"
timeoutMs = 120000
allowedTools = []
sessionLimitThreshold = 90

[jobs.powehi-dev-v1]
expression = "45 1,4,7,10,13,16,19,22 * * *"
cwd = "/Users/fn/codespace/powehi"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 1800000
allowedTools = []
sessionLimitThreshold = 90

[jobs.the-kernel-dev-v1]
expression = "50 */2 * * *"
cwd = "/Users/fn/codespace/the_kernel"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 3600000
maxBudget = 10
allowedTools = []
sessionLimitThreshold = 90
# ── Foundation repos (added 2026-09-05; minutes chosen to avoid the existing jobs) ──

# ── Kingdom realm cycles ─────────────────────────────────────────────────────
[jobs.sigil-cycle]
expression = "5 0,8,16 * * *"
cwd = "/Users/fn/codespace/sigil"
model = "sonnet"
permissionMode = "bypassPermissions"
timeoutMs = 1800000
allowedTools = []
sessionLimitThreshold = 90
blockTokenLimit = 80000000
extraArgs = ["--add-dir", "/Users/fn/codespace/citadel", "--settings", "/Users/fn/codespace/citadel/realms/sigil/settings.json", "--append-system-prompt-file", "/Users/fn/codespace/citadel/core/CONTRACT.md", "--permission-prompts", "none", "--effort", "high"]

